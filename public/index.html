<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic complaint resolution system</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=21" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cra_troy_theme') || localStorage.getItem('policy_sim_theme');
          if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div class="frame">
      <div class="top-warning-banner" id="top-warning-banner" role="alert" aria-live="assertive" style="display: none;">
        <svg class="warning-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span id="top-warning-text">API key has not been entered</span>
      </div>
      <header class="topbar">
        <div class="topbar__left">
          <div class="topic-pill">
            <span class="dot"></span>
            <span id="topic-text">Current Complaint: Awaiting update</span>
          </div>
        </div>
        <div class="topbar__center">
          Agentic complaint resolution system
        </div>
        <div class="topbar__right">
          <div class="user-profile-menu" id="user-profile-menu">
            <button
              type="button"
              class="user-avatar-btn"
              id="user-avatar-btn"
              aria-label="User profile and settings"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <div class="user-avatar-circle" id="user-avatar-circle">
                <svg class="user-avatar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="user-avatar-initial" id="user-avatar-initial" style="display:none;">U</span>
                <img class="user-avatar-image" id="user-avatar-image" alt="User Profile" referrerpolicy="no-referrer" style="display:none;" />
              </div>
            </button>
            <div class="user-dropdown" id="user-dropdown" role="menu" aria-label="User menu">
              <div class="user-dropdown-header">
                <div class="user-dropdown-avatar-wrap">
                  <div class="user-dropdown-avatar" id="user-dropdown-avatar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <img class="user-dropdown-avatar-image" id="user-dropdown-avatar-image" alt="User Profile" referrerpolicy="no-referrer" style="display:none;" />
                  </div>
                </div>
                <div class="user-dropdown-info">
                  <div class="user-dropdown-kicker">
                    <span class="dot"></span>
                    <span>Signed In</span>
                  </div>
                  <div class="user-dropdown-name" id="user-dropdown-name">Admin</div>
                </div>
              </div>
              <div class="user-dropdown-email-box">
                <svg class="dropdown-email-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span class="user-dropdown-email" id="user-dropdown-email" title="">loading...</span>
              </div>
              <div class="user-dropdown-divider"></div>
              <div class="user-dropdown-actions">
                <button type="button" class="user-dropdown-item" id="user-menu-theme" role="menuitem" aria-label="Toggle light or dark theme">
                  <svg class="dropdown-item-icon theme-icon-dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                  </svg>
                  <svg class="dropdown-item-icon theme-icon-light" style="display:none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                  </svg>
                  <span id="theme-menu-label">Theme</span>
                  <span class="dropdown-item-badge" id="theme-status-badge">Dark</span>
                </button>
                <button type="button" class="user-dropdown-item user-dropdown-item--danger" id="user-menu-signout" role="menuitem">
                  <svg class="dropdown-item-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  <span>Sign Out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="panel feed" id="feed-list">
          <div class="feed-actions" id="feed-actions">
            <div class="provider-config-box" id="provider-config-box">
              <div class="config-field">
                <label for="provider-select" class="config-label">
                  <span>Provider</span>
                  <span class="config-label-sub" id="provider-badge">None</span>
                </label>
                <div class="config-select-wrapper">
                  <select class="config-select" id="provider-select">
                    <option value="" disabled selected>Select Provider</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="groq">Groq</option>
                    <option value="lmstudio">LM Studio</option>
                  </select>
                </div>
              </div>

              <div class="config-field" id="model-config-field">
                <label for="model-select" class="config-label" id="model-field-label">
                  <span>Model</span>
                </label>
                <!-- Dropdown for cloud providers -->
                <div class="config-select-wrapper" id="model-select-wrapper">
                  <select class="config-select" id="model-select">
                    <option value="" disabled selected>Select Model</option>
                  </select>
                </div>
                <!-- Free-form text input for LM Studio -->
                <div class="config-input-wrapper" id="model-input-wrapper" style="display: none;">
                  <input
                    type="text"
                    class="config-input"
                    id="model-input"
                    placeholder="e.g. qwen2.5-7b-instruct, local-model"
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>
              </div>

              <div class="config-field" id="api-key-field">
                <label for="api-key-input" class="config-label">
                  <span>API Key</span>
                  <span class="config-label-sub" id="api-key-hint"></span>
                </label>
                <div class="config-input-wrapper with-icon">
                  <input
                    type="password"
                    class="config-input"
                    id="api-key-input"
                    placeholder="Enter API Key"
                    autocomplete="off"
                    spellcheck="false"
                  />
                  <button type="button" class="config-icon-btn" id="toggle-key-visibility" title="Toggle visibility" aria-label="Toggle API Key visibility">
                    <svg class="eye-icon eye-open" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-icon eye-closed" style="display:none;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                  </button>
                </div>
              </div>

              </div>

            <button class="feed-btn" id="fetch-next" type="button">Begin Resolution</button>
          </div>
          <div class="feed-body" id="feed-body">
            <div class="feed-empty" id="feed-empty">Simulate any complaint resolution</div>
          </div>
          <div class="feed-controls" aria-label="Complaint resolution details">
            <textarea
              class="feed-input feed-input--primary"
              id="topic-input"
              placeholder="Type in details of a complaint resolution"
              aria-label="Complaint resolution details"
              rows="2"
            ></textarea>
          </div>
        </section>

        <section class="panel deliberation" id="deliberation-list">
          <div class="agent-card troy" id="troy-card">
            <div class="agent-avatar">
              <video class="agent-avatar-video" autoplay loop muted playsinline>
                <source src="/assets/images/AI_spin.webm" type="video/webm" />
              </video>
              <canvas class="agent-avatar-canvas" width="96" height="96"></canvas>
            </div>
            <div>
              <div class="agent-name" id="troy-name">Troy <span class="troy-role-tag" id="troy-role">Lead Resolution Agent</span></div>
              <div class="agent-speech troy-speech" id="troy-speech">Waiting for resolution signal.</div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="/js/app.js?v=21"></script>
  </body>
</html>
